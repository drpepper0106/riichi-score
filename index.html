function result(e){return `<aside class="result" id="result-summary" aria-live="polite"><div class="result-top"><span class="eyebrow">这一手 · 结算</span><span class="status-tag">${e.valid?'已算好':e.errors.length?'请核对':'待填写'}</span></div>${e.valid?`<h2 class="result-caption">${e.yakuman?e.result.tier:`${e.han} 番 ${e.fu.value} 符`}${e.result.tier&&!e.yakuman?`<span class="tier">${e.result.tier}</span>`:''}</h2><p>${s.dealer?'庄家':'闲家'} · ${s.win==='ron'?'荣和':'自摸'}</p><div class="payouts">${e.result.payments.map(p=>`<div class="payout"><span>${p.who}${p.count>1?'各':''}支付</span><strong>${fmt(p.amount)}<small> 点</small></strong>${p.extra?`<small>基本 ${fmt(p.base)} ＋ 本场 ${fmt(p.extra)}</small>`:''}</div>`).join('')}</div>${e.result.deposit?`<div class="deposit">桌上立直棒 <b>＋${fmt(e.result.deposit)}</b></div>`:''}<div class="total"><span>合计收到</span><b>${fmt(e.result.total)} <small>点</small></b></div>${e.result.tier&&!e.yakuman?'<p class="subtle">已达到固定档位，符数不影响支付点数。</p>':''}`:`<h2>${e.errors.length?'有几处需要核对':e.fu.value?`已算出 ${e.fu.value} 符`:'先选牌型，<br>点数交给我。'}</h2><p>${e.missing.length?'还差：'+e.missing.join('、'):'修正下方输入后，即时更新结算。'}</p>${e.errors.length?`<ul class="error-list">${e.errors.map(t=>`<li><button data-jump="${/役|番|宝牌/.test(t)?'han-section':'fu-section'}">${esc(t)}</button></li>`).join('')}</ul>`:''}<div class="metrics"><div><b>${e.han||'—'}</b><span>番</span></div><div><b>${e.fu.errors.length?'—':e.fu.value||'—'}</b><span>符</span></div></div>`}<div class="result-footer">四人日麻 · 按当前规则结算</div></aside>`;}
const waitOptions=[opt('ryanmen','两面','45 等 3 / 6'),opt('shanpon','双碰','33、77 等 3 / 7'),opt('kanchan','嵌张','46 等 5'),opt('penchan','边张','12 等 3；89 等 7'),opt('tanki','单骑','单张等另一张成对')];
function meld(m,i){const fu=E.meldFu(m),ready=m.type&&m.source&&(m.type==='seq'||m.edge!==null);return `<div class="meld" id="meld-${i}"><div class="meld-title"><h3><span>${i+1}</span> 面子 ${i+1}</h3><span class="fu-badge">${ready?'＋'+fu+' 符':'待选择'}</span></div>${choices('melds.'+i+'.type',[opt('seq','顺子'),opt('trip','刻子'),opt('quad','杠子')])}${m.type?`<p class="hint">${m.type==='seq'?'同一花色，连续三张，如三四五万。':m.type==='trip'?'三张相同的牌。':'四张相同的牌，已声明开杠。'}</p>${m.type!=='seq'?field('是哪类牌？',choices('melds.'+i+'.edge',[opt(false,'2～8 数牌'),opt(true,'1、9 或字牌')])):''}${field('如何组成？',choices('melds.'+i+'.source',m.type==='seq'?[opt('closed','手牌组成'),opt('open','吃牌组成')]:m.type==='quad'?[opt('closed','暗杠'),opt('open','明杠 / 加杠')]:[opt('closed','自己摸齐'),opt('open','碰牌组成'),...(s.win==='ron'||m.source==='ron'?[opt('ron','本次荣和补齐')]:[])]))}${m.source==='ron'?'<p class="note">这组刻子按明刻加符，但本次荣和不破坏门前清。</p>':''}`:''}</div>`;}
function fuPanel(e){return `<section class="panel" id="fu-section">${title('02','这手牌有多少符？',`<span class="head-value">${e.fu.value&&!e.fu.errors.length?e.fu.value+' 符':''}</span>`)}${choices('fuMode',[opt('guided','帮我算符'),opt('direct','直接选符')])}${s.fuMode==='direct'?`<p class="hint">已经知道符数，直接选就好。</p>${choices('directFu',E.FUS.map(n=>opt(n,n+' 符')),'grid')}`:s.kind==='seven'?'<div class="special"><b>25 <small>符</small></b><p>七对子固定 25 符<br>不加自摸、单骑或荣和符，也不进位。</p></div>':`${field('雀头是什么？',choices('pair',[opt('number','数牌','万 / 筒 / 索'),opt('dragon','白 / 发 / 中'),opt('wind','风牌','东 / 南 / 西 / 北')]))}${s.pair==='wind'?`<div class="checks"><label><input type="checkbox" data-check="seat" ${s.seat?'checked':''}>是我的自风</label><label><input type="checkbox" data-check="round" ${s.round?'checked':''}>是当前场风</label></div><p class="hint">东场南家：东是场风，南是自风。两者都不是可不勾选。</p>`:''}${field('这张牌是怎么等到的？',choices('wait',waitOptions,'grid'))}<details data-detail="wait-help"><summary>听牌方式拿不准？</summary><p class="hint">按本次和牌张在当前拆分中的作用选择，不看牌山里还剩几张。23 和 1 是两面，不是边张。多种拆分都成立时，请分别尝试。</p>${tiles(s.wait==='kanchan'?'4m 6m 5m':s.wait==='penchan'?'1m 2m 3m':s.wait==='shanpon'?'33m 77p':s.wait==='tanki'?'5m 5m':'4m 5m 3m 6m')}</details><div class="row-heading"><h3>四组面子</h3><button class="text-button" data-action="fill-seq">其余均为顺子</button></div>${s.melds.map(meld).join('')}`}${e.fu.errors.length?`<div class="inline-error">${e.fu.errors.map(esc).join('<br>')}</div>`:''}</section>`;}
function detailsFu(e){if(!e.fu.value||e.yakuman)return '';return `<details class="panel breakdown" data-detail="fu-breakdown" open><summary>为什么是 ${e.fu.value} 符？</summary><div class="lines">${e.fu.lines.map(([name,n])=>`<div><span>${name}</span><b>${n===null?'—':n}</b></div>`).join('')}<div class="sum"><span>${e.fu.raw===e.fu.value?'最终符数':`合计 ${e.fu.raw} → 向上取整`}</span><b>${e.fu.value} 符</b></div></div></details>`;}
function hanPanel(e){return `<section class="panel" id="han-section">${title('03',s.kind==='yakuman'?'役满倍数':'番数是多少？')}<div class="mode-line"><span class="hint">${s.hanMode==='yaku'?'按已选役种计番':'手动输入'}</span><button class="text-button" data-action="reference">参考役种 →</button></div>${s.hanMode==='yaku'?`<div class="selected-summary">${(e.yaku?.selected||[]).map(y=>`<span class="chip">${y.name}</span>`).join('')||'尚未选择役种'}</div><p class="hint">${e.yakuman?e.yakuman+' 倍役满':e.han+' 番，含宝牌'} · 修改役种会同步更新</p><button class="quiet" data-action="manual">改为手动输入</button>`:s.kind==='yakuman'?choices('yakuman',[1,2,3,4,5,6].map(n=>opt(n,n===1?'单倍役满':n+' 倍役满')),'grid'):`<label class="field-label">总番数，包含宝牌</label><div class="han-choices">${[1,2,3,4,5,6,7].map(n=>`<button data-set="han" data-value="${n}" class="${s.han===n?'selected':''}" aria-pressed="${s.han===n}">${n}</button>`).join('')}<button data-action="expand-han" class="${s.han>=8&&s.han<=12?'selected':''}">8～12</button><button data-set="han" data-value="13" class="${s.han===13?'selected':''}">13＋</button></div>${expandedHan||s.han>=8&&s.han<=12?choices('han',[8,9,10,11,12].map(n=>opt(n,n+' 番'))):''}<p class="hint">请确认至少有一个役；宝牌本身不能作为和牌的役。</p>`}<button class="text-button yakuman-entry" data-action="toggle-yakuman">${s.kind==='yakuman'?'← 返回普通计分':'这手是役满？进入役满结算'}</button></section>`;}
function calc(){let e=E.evaluate(s);return `<div class="workspace">${result(e)}<div class="input-column"><section class="panel" id="basic-section">${title('01','基本情况')}<div class="basic-grid">${field('我的身份',choices('dealer',[opt(false,'闲家'),opt(true,'庄家')]))}${field('和牌方式',choices('win',[opt('ron','荣和'),opt('tsumo','自摸')]))}</div>${s.kind!=='yakuman'||s.hanMode==='yaku'?`${field('门前状态',choices('closed',[opt(true,'门前清'),opt(false,'有副露')]),'没有吃、碰、明杠就是门前清，暗杠不影响。')}${s.fuMode==='guided'&&s.kind!=='yakuman'?field('手牌结构',choices('kind',[opt('normal','普通牌型','四组面子＋雀头'),opt('seven','七对子','七组不同对子')])):''}`:''}</section>${s.kind!=='yakuman'?fuPanel(e):''}${hanPanel(e)}<details class="panel" data-detail="extra"><summary>本场与桌上立直棒 <small>${s.honba+' 本场 · '+s.sticks+' 根'}</small></summary><p class="hint">不影响番符，只在基本点数上追加。</p>${count('honba','本场数')}${count('sticks','桌上立直棒')}<p class="hint">每本场：荣和加 300 点，自摸每家加 100 点。桌上每根立直棒为 1,000 点，由和牌者收取。</p></details>${detailsFu(e)}<div class="reset-row"><button class="quiet" data-action="reset">↺ 重新计算一手</button></div><p class="footnote">按你填写的牌型计分。多个拆分请分别尝试；不自动判定振听、包牌或和牌是否合法。</p></div></div><button class="mobile-summary" data-jump="result-summary">${e.valid?`${e.yakuman?e.result.tier:`${e.han} 番 ${e.fu.value} 符`} · 收到 ${fmt(e.result.total)} 点`:e.errors.length?'有输入需要核对 ↑':e.fu.value?`${e.fu.value} 符 · ${e.missing.length?'还需 '+e.missing[0]:'查看结果'} ↑`:'填写牌型，即时算符 ↑'}</button>`;}
function yaku(){let yc=E.yakuCount(s),list=E.YAKU.filter(y=>(s.filter==='all'||s.filter==='yakuman'&&y.yakuman||s.filter===String(y.closed)&&!y.yakuman)&&(!s.query||y.name.includes(s.query)||y.desc.includes(s.query)||s.query==='断幺'&&y.id==='tanyao')&&(!s.onlyAvailable||s.closed!==false||!y.menzen&&(y.id!=='tanyao'||s.rules.kuitan)));return `<div class="page-heading"><span class="eyebrow">YAKU REFERENCE</span><h2>役种，一眼查清。</h2><p>选中成立的役，番数一起算。</p></div><div class="yaku-toolbar"><input id="yaku-search" type="search" placeholder="搜索役种，例如：断幺、三色" value="${esc(s.query)}" aria-label="搜索役种"><div class="filter-chips">${choices('filter',[opt('all','全部'),opt('1','1 番'),opt('2','2 番'),opt('3','3 番'),opt('6','6 番'),opt('yakuman','役满')])}</div><div class="mode-line"><span class="hint">${s.closed===null?'门前状态未选，暂显示门前番数':s.closed?'当前门前清':'当前有副露'}</span><label class="check-label"><input type="checkbox" data-check="onlyAvailable" ${s.onlyAvailable?'checked':''}>只看当前可用</label></div></div><div class="yaku-layout"><div class="yaku-list">${list.length?list.map(y=>{const checked=s.yaku.includes(y.id),value=y.yakuman?(y.yakuman===2&&s.rules.doubleYakuman?'双倍役满':'役满'):(s.closed===false?y.open:y.closed)+' 番';return `<article class="yaku-card ${checked?'picked':''}"><button class="yaku-pick" data-yaku="${y.id}" aria-pressed="${checked}"><span class="tick-box">${checked?'✓':''}</span><span><strong>${y.name}</strong><small>${y.yakuman?(y.menzen?'门前限定':'可副露'):`门前 ${y.closed} 番 · ${y.open?'副露 '+y.open+' 番':'门前限定'}`}</small></span><b class="yaku-value">${value}</b></button><p>${y.desc}</p><details data-detail="yaku-${y.id}"><summary>牌例与易错点</summary>${tiles(y.example)}<p>${y.tip}</p>${y.example?'<small class="muted">展示役种结构；部分牌例省略其他面子。</small>':''}</details></article>`;}).join(''):'<div class="panel"><p>没有找到这个役种，试试更短的名称。</p></div>'}</div><aside class="panel yaku-total" id="yaku-total">${title('＋','已选役种')}<div class="selected-summary">${E.YAKU.filter(y=>s.yaku.includes(y.id)).map(y=>`<button class="chip" data-yaku="${y.id}">${y.name} ×</button>`).join('')||'<span class="hint">还没有选择，点选左侧或上方的役种。</span>'}</div><button class="text-button" data-action="clear-yaku">清空选择</button>${!yc.yakuman?`<hr>${count('dora','宝牌',40)}${count('aka','赤宝牌',4)}${count('ura','里宝牌',40)}<p class="hint">填写实际宝牌张数，杠宝牌并入宝牌；里宝牌需立直。</p>`:'<p class="note">真实役满计分时，普通役和宝牌不再叠加。</p>'}<div class="yaku-sum"><span>当前合计</span><b>${yc.yakuman?yc.yakuman+' 倍役满':yc.han+' 番'}</b></div>${yc.errors.length?`<div class="inline-error">${yc.errors.map(esc).join('<br>')}</div>`:''}<button class="primary full" data-action="apply-yaku" ${!yc.selected.length?'disabled':''}>${yc.yakuman?'使用此役满':'使用此番数'} →</button><p class="hint">按门前番数分组；副露减番已自动处理。具体牌面和成立条件请自行核对。</p></aside></div><button class="mobile-summary" data-jump="yaku-total">已选 ${s.yaku.length} 个役 · ${yc.yakuman?yc.yakuman+' 倍役满':yc.han+' 番'} · 查看合计 ↓</button>`;}
function cellLabel(r){return r.payments.map(p=>`${s.tableWin==='ron'?'':s.tableDealer?'每家付 ':p.who==='庄家'?'庄家付 ':'闲家付 '}${fmt(p.amount)}`).join('<br>');}
function pointTable(){const e=E.evaluate(s);return `<div class="page-heading"><span class="eyebrow">SCORE TABLE</span><h2>点数，随手查。</h2><p>按每位玩家的实际支付显示，不含本场和立直棒。</p></div><section class="panel"><div class="basic-grid">${choices('tableDealer',[opt(false,'闲家'),opt(true,'庄家')])}${choices('tableWin',[opt('ron','荣和'),opt('tsumo','自摸')])}</div><p class="hint">${s.tableWin==='ron'?'表内数值为放铳者支付。':'表内数值为每位付款人的支付。'}点击格子看详情。</p><div class="table-scroll"><table><thead><tr><th>符 / 番</th>${[1,2,3,4].map(n=>`<th>${n} 番</th>`).join('')}</tr></thead><tbody>${E.FUS.map(f=>`<tr><th>${f} 符</th>${[1,2,3,4].map(h=>{const error=E.combination(f,h,s.tableWin);let r=E.score({fu:f,han:h,dealer:s.tableDealer,win:s.tableWin,rules:s.rules});let active=e.valid&&!e.yakuman&&s.dealer===s.tableDealer&&s.win===s.tableWin&&e.fu.value===f&&e.han===h;return `<td class="${r.tier?'limit':''} ${active?'current-cell':''}"><button data-cell="${f},${h}" aria-label="${f}符${h}番">${error?'<span class="dash">—</span>':`${cellLabel(r)}${r.tier?`<small>${r.tier}</small>`:''}`}</button></td>`;}).join('')}</tr>`).join('')}</tbody></table></div><p class="footnote">“—”表示不成立的常规组合。1 番 30 符荣和也可以是门前平和。</p></section><section class="panel">${title('満','满贯及以上')}<div class="limit-list">${[5,6,8,11,13].map(h=>{let r=E.score({fu:30,han:h,dealer:s.tableDealer,win:s.tableWin,rules:s.rules});return `<button data-cell="30,${h}"><span><b>${r.tier}</b><small>${{5:'5 番，或番符达到满贯',6:'6～7 番',8:'8～10 番',11:'11～12 番',13:'13 番及以上'}[h]}</small></span><strong>${cellLabel(r)}</strong></button>`;}).join('')}<button data-cell="0,0,1"><span><b>真实役满</b><small>多倍役满按倍数结算</small></span><strong>${cellLabel(E.score({fu:0,han:0,yakuman:1,dealer:s.tableDealer,win:s.tableWin,rules:s.rules}))}</strong></button></div></section>`;}
function captureDetails(){document.querySelectorAll('details[data-detail]').forEach(d=>detailState[d.dataset.detail]=d.open);}
function render(){captureDetails();const active=document.activeElement;const focusId=active?.id,number=active?.dataset?.number;let pos=active?.selectionStart;$('#app').innerHTML=s.tab==='calc'?calc():s.tab==='yaku'?yaku():pointTable();document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===s.tab);b.setAttribute('aria-current',b.dataset.tab===s.tab?'page':'false');});document.querySelectorAll('details[data-detail]').forEach(d=>{if(d.dataset.detail in detailState)d.open=detailState[d.dataset.detail];});if(focusId){let el=document.getElementById(focusId);if(el){el.focus({preventScroll:true});if(typeof pos==='number'&&el.type==='search')el.setSelectionRange(pos,pos);}}else if(number){let el=document.querySelector(`[data-number="${number}"]`);if(el)el.focus({preventScroll:true});}save();}
function switchTab(t){scrolls[s.tab]=window.scrollY;s.tab=t;render();window.scrollTo(0,scrolls[t]||0);}
function notify(text,withUndo=false){clearTimeout(toastTimer);$('#toast').innerHTML=esc(text)+(withUndo?' <button data-action="undo">撤销</button>':'');$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),withUndo?8000:4000);}
function dialog(html){$('#modal-content').innerHTML=html;$('#modal').showModal();}
function settings(){dialog(`<span class="eyebrow">RULE SETTINGS</span><h2>按你的牌桌规则</h2><p class="hint">修改后立即重算，设置保存在本机。</p>${field('连风雀头',choices('rules.doubleWind',[opt(4,'4 符'),opt(2,'2 符')]))}${[['kiriage','切上满贯','4 番 30 符、3 番 60 符按满贯'],['kazoe','累计役满','13 番以上按役满；关闭则按三倍满'],['kuitan','允许副露断幺九（食断）','吃、碰后，断幺九仍可作为 1 番役'],['doubleYakuman','特殊双倍役满','国士十三面、四暗刻单骑、纯正九莲、大四喜']].map(([k,t,d])=>`<label class="setting-row"><span><b>${t}</b><small>${d}</small></span><input type="checkbox" role="switch" data-rule="${k}" ${s.rules[k]?'checked':''}></label>`).join('')}<p class="note">兼容的真实役满可以叠加。暂不处理包牌、三人麻将和多家和牌。</p><button class="quiet" data-action="default-rules">恢复默认规则</button>`);}
function selectYaku(id){if(s.yaku.includes(id)){s.yaku=s.yaku.filter(y=>y!==id);render();return;}const replaces={doubleRiichi:'riichi',ryanpeikou:'iipeikou',chinitsu:'honitsu',junchan:'chanta',kokushi13:'kokushi',suuankouTanki:'suuankou',junseiChuuren:'chuuren',daisuushii:'shousuushii'};let old=replaces[id];if(old&&s.yaku.includes(old)){s.yaku=s.yaku.filter(y=>y!==old);notify('已用'+E.YAKU.find(y=>y.id===id).name+'替换'+E.YAKU.find(y=>y.id===old).name);}s.yaku.push(id);render();}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.classList.contains('close-modal')){$('#modal').close();return;}if(b.id==='settings-open'){settings();return;}if(b.dataset.tab){switchTab(b.dataset.tab);return;}if(b.dataset.jump){document.getElementById(b.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'});return;}if(b.dataset.set){const p=b.dataset.set,v=JSON.parse(b.dataset.value);if(p.startsWith('melds.')&&p.endsWith('.type')){const i=Number(p.split('.')[1]);if(s.melds[i].type!==v)s.melds[i]={type:v,edge:null,source:null};}else set(p,v);render();if(p.startsWith('rules.')&&$('#modal').open){$('#modal').close();settings();}return;}if(b.dataset.inc){set(b.dataset.inc,Math.max(0,Math.min(Number(b.dataset.max||99),get(b.dataset.inc)+Number(b.dataset.delta))));render();return;}if(b.dataset.yaku){selectYaku(b.dataset.yaku);return;}if(b.dataset.cell){let [f,h,y=0]=b.dataset.cell.split(',').map(Number),error=y?null:E.combination(f,h,s.tableWin);let r=E.score({fu:f,han:h,yakuman:y,dealer:s.tableDealer,win:s.tableWin,rules:s.rules});dialog(`<span class="eyebrow">点数详情</span><h2>${y?'役满':h+' 番 '+f+' 符'}</h2><p class="hint">${s.tableDealer?'庄家':'闲家'} · ${s.tableWin==='ron'?'荣和':'自摸'}</p>${error?`<p class="note">${error}</p>`:`${r.payments.map(p=>`<div class="payment-detail"><span>${p.who}${p.count>1?'各':''}支付</span><b>${fmt(p.amount)} 点</b></div>`).join('')}<p class="note">${r.tier?r.tier+' · ':''}合计 ${fmt(r.total)} 点，不含本场与桌上立直棒。</p>`}`);return;}
 switch(b.dataset.action){case 'reference':switchTab('yaku');break;case 'fill-seq':{let hasOpen=s.melds.some(m=>m.source==='open');for(const m of s.melds)if(!m.type){m.type='seq';m.source=s.closed===false&&!hasOpen?'open':'closed';if(m.source==='open')hasOpen=true;}render();notify('已补齐空白面子为顺子，可逐组修改。');break;}case 'expand-han':expandedHan=!expandedHan;render();break;case 'manual':s.han=E.yakuCount(s).han||null;s.hanMode='manual';render();break;case 'toggle-yakuman':s.kind=s.kind==='yakuman'?'normal':'yakuman';s.hanMode='manual';render();break;case 'apply-yaku':{const yc=E.yakuCount(s);if(yc.yakuman)s.kind='yakuman';else if(s.yaku.includes('chiitoi')&&s.fuMode==='guided')s.kind='seven';else if(s.kind==='yakuman')s.kind='normal';s.hanMode='yaku';switchTab('calc');window.scrollTo({top:0,behavior:'smooth'});break;}case 'clear-yaku':s.yaku=[];s.dora=s.aka=s.ura=0;render();break;case 'reset':undo=structuredClone(s);clearTimeout(undoTimer);s={...E.initial(),rules:{...s.rules}};detailState={};render();window.scrollTo({top:0,behavior:'smooth'});notify('已开始新的一手',true);undoTimer=setTimeout(()=>undo=null,8000);break;case 'undo':if(undo){s=undo;undo=null;render();$('#toast').classList.remove('show');}break;case 'default-rules':s.rules={...E.RULES};render();$('#modal').close();settings();notify('已恢复默认规则');break;}
});
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.check){set(el.dataset.check,el.checked);render();}if(el.dataset.rule){s.rules[el.dataset.rule]=el.checked;render();}if(el.dataset.number){let n=Number(el.value);if(!Number.isFinite(n))n=0;set(el.dataset.number,Math.max(0,Math.min(Number(el.max),Math.floor(n))));render();}});
document.addEventListener('input',event=>{if(event.target.id==='yaku-search'){s.query=event.target.value;render();}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#modal').close();}});
render();
// Standalone edition: all assets are embedded for offline use.
const context=document.modelContext;if(context?.registerTool){const life=new AbortController();try{Promise.resolve(context.registerTool({name:'get_riichi_calculation',description:'Read the current riichi inputs and calculation without changing them.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute(){return E.evaluate(s);}},{signal:life.signal})).catch(()=>{});Promise.resolve(context.registerTool({name:'set_riichi_quick_calculation',description:'Set direct fu, han, dealer and win method and show the calculation. Replaces current scoring mode.',inputSchema:{type:'object',properties:{fu:{type:'integer',enum:E.FUS},han:{type:'integer',minimum:1,maximum:13},dealer:{type:'boolean'},win:{type:'string',enum:['ron','tsumo']}},required:['fu','han','dealer','win'],additionalProperties:false},annotations:{readOnlyHint:false},execute(v){if(!v||!E.FUS.includes(v.fu)||!Number.isInteger(v.han)||v.han<1||v.han>13||typeof v.dealer!=='boolean'||!['ron','tsumo'].includes(v.win))throw Error('Invalid scoring input');const error=E.combination(v.fu,v.han,v.win);if(error)throw Error(error);s={...s,fuMode:'direct',kind:'normal',directFu:v.fu,han:v.han,dealer:v.dealer,win:v.win,closed:null,hanMode:'manual'};switchTab('calc');return E.evaluate(s);}},{signal:life.signal})).catch(()=>{});}catch{}window.addEventListener('pagehide',()=>life.abort(),{once:true});}
})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
</script></body></html>
